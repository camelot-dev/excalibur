name: Deploy demo to Hugging Face Spaces

# Pushes master to a Docker Space that builds and runs the Dockerfile.
# Needs the repository secret HF_TOKEN (a write token) and the variable
# HF_SPACE (e.g. "camelot-dev/excalibur"). Skipped while either is missing.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.HF_SPACE != ''
    steps:
      - uses: actions/checkout@v5

      - name: Add the Space metadata to the README
        # Spaces read their settings from YAML front matter in README.md.
        run: |
          {
            echo "---"
            echo "title: Excalibur"
            echo "emoji: 📊"
            echo "colorFrom: green"
            echo "colorTo: gray"
            echo "sdk: docker"
            echo "app_port: 7860"
            echo "pinned: false"
            echo "license: mit"
            echo "short_description: Web interface to extract tables from PDFs"
            echo "---"
            echo
            cat README.md
          } > README.space.md
          mv README.space.md README.md

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Upload to the Space
        # `hf upload` stores binary files (logo, fonts) the way the Hub
        # requires; a plain git push of them is rejected.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" || { echo "HF_TOKEN secret is not set"; exit 1; }
          uvx --from huggingface_hub hf upload "$HF_SPACE" . . \
            --repo-type space \
            --exclude ".git/*" --exclude "docs/*" --exclude "tests/*" \
            --delete "*" \
            --commit-message "Deploy ${GITHUB_SHA::7}"
